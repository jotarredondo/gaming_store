<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gaming Store</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>Gaming Store</h1>
    <p><i>El lugar para los real gamers.</i></p>
</header>

<!-- NAVEGACIÓN -->
<nav class="navbar navbar-expand-md navbar-dark bg-success">
    <div class="container">

        <a class="navbar-brand" href="index.html">
            Gaming Store
        </a>

        <!-- BURGER BTN -->
        <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarGaming"
                aria-controls="navbarGaming"
                aria-expanded="false"
                aria-label="Abrir navegación">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú -->
        <div class="collapse navbar-collapse" id="navbarGaming">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#productos">Productos</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main>

    <section class="contacto">
        <h2>Contacto</h2>

        <p>¿Tienes alguna consulta sobre nuestros productos?
            Envíanos un mensaje.</p>

        <form id="formContacto" class="formulario-contacto">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@email.com" required>
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..." required></textarea>
            </div>

            <button type="submit">Enviar mensaje</button>
        </form>
    </section>
</main>


<footer id="footer">
    <p>Email: contacto@gamingstore.cl</p>
        <p>Síguenos en <a href="https://www.instagram.com/">Instagram</a></p>
</footer>

<!-- BOOTSTRAP JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JAVASCRIPT PROPIO -->
<script src="script.js"></script>
</body>

</html>
